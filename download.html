<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #27468a;
      --gold: #e8dc7f;
      --bg-1: #0d1527;
      --bg-2: #19263d;
      --white: #f4f0ea;
      --muted: #dfe3ee;
      --card: rgba(15, 22, 33, 0.78);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(18, 27, 44, 0.9), rgba(7, 11, 19, 0.95)),
                  url('./codioful-formerly-gradienta-bKESVqfxass-unsplash.jpg') center/cover no-repeat fixed;
      font-family: "Oswald", sans-serif;
      color: var(--white);
      position: relative;
    }

    .top-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      background: #e8dc7f;
      color: #171717;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-family: "Oswald", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(232, 220, 127, 0.2);
    }

    .card {
      width: min(560px, 85vw);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 32px 24px 28px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(232, 220, 127, 0.12);
      border: 1px solid rgba(232, 220, 127, 0.35);
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.76rem;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 auto 22px;
      max-width: 420px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 12px 0 18px;
    }

    .qr-wrap img {
      width: min(300px, 62vw);
      border-radius: 18px;
      background: white;
      padding: 14px;
      box-shadow: 0 16px 28px rgba(0,0,0,0.18);
    }

  </style>
</head>
<body>
  <button class="top-btn"><a href="index.html">Back</a></button>

  <div class="card">
    <div class="badge">Scan & shop</div>
    <h1>Choose us</h1>
    <p>Discover a warm and premium shopping experience with a simple scan to access everything you need.</p>
    <div class="qr-wrap">
      <img src="./qrcode_405144754_11952d1ec8e8a55c85bff023ed95c085.png" alt="QR code" />
    </div>
  </div>
</body>
</html>
